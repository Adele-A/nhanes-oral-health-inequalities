name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: R ${{ matrix.config.r }} on ${{ matrix.config.os }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest,  r: 'release' }
          - { os: windows-latest, r: 'release' }
          - { os: macos-latest,   r: 'release' }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_REPOS_OVERRIDE: https://cloud.r-project.org

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Syntax check (lint) all R sources
        shell: Rscript {0}
        run: |
          files <- list.files(c("R", "tests"), pattern = "[.]R$",
                               recursive = TRUE, full.names = TRUE)
          files <- c(files, "run_all.R")
          ok <- TRUE
          for (f in files) {
            res <- tryCatch({ parse(f); TRUE },
                            error = function(e) { message("Parse error in ", f, ": ", conditionMessage(e)); FALSE })
            ok <- ok && res
          }
          if (!ok) stop("One or more R files failed to parse.")
          cat("All", length(files), "R files parsed OK.\n")

      - name: Run testthat on synthetic fixtures (no network)
        shell: Rscript {0}
        run: |
          source("tests/testthat.R")
